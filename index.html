<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>董博文的个人主页</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 页面背景：深色渐变，显得现代且有科技感 */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 主卡片容器 */
        .container {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 头部区域 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #38bdf8; /* 亮蓝色 */
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .header .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 300;
        }

        /* 内容区块 */
        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            font-size: 1.3rem;
            color: #38bdf8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section p {
            line-height: 1.8;
            color: #cbd5e1;
            font-size: 1rem;
        }

        /* 技能标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        /* 联系信息列表 */
        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            color: #cbd5e1;
        }

        .contact-list li span {
            color: #94a3b8;
            font-size: 0.9rem;
            min-width: 60px;
        }

        /* 响应式设计（手机端适配） */
        @media (max-width: 600px) {
            .container { padding: 25px; }
            .header h1 { font-size: 1.8rem; }
            .header .subtitle { font-size: 0.95rem; }
            .section h2 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>董博文</h1>
            <p class="subtitle">沈阳理工大学 · 网络工程专业 · 本科生</p>
        </div>

        <!-- 关于我 -->
        <div class="section">
            <h2>👤 关于我</h2>
            <p>大家好，我是董博文。我是一个热爱探索新事物、喜欢迎接挑战的人。在技术学习的道路上，我始终保持着好奇心与热情，目前正在努力学习 C 语言和 Python，希望能在编程的世界里不断突破自我。</p>
        </div>

        <!-- 技能 -->
        <div class="section">
            <h2>💻 专业技能</h2>
            <div class="tags">
                <span class="tag">C语言编程</span>
                <span class="tag">Python（学习中）</span>
                <span class="tag">网络工程基础</span>
            </div>
        </div>

        <!-- 兴趣爱好 -->
        <div class="section">
            <h2>🏸 兴趣爱好</h2>
            <div class="tags">
                <span class="tag">羽毛球</span>
                <span class="tag">打游戏</span>
                <span class="tag">刷剧</span>
                <span class="tag">跑步</span>
            </div>
        </div>

        <!-- 联系方式 -->
        <div class="section">
            <h2>📞 联系方式</h2>
            <ul class="contact-list">
                <li><span>邮箱：</span>2539124915@qq.com</li>
            </ul>
        </div>
    </div>

</body>
</html>
